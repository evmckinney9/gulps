[package]
name = "gulps_accelerate"
version = "0.4.0"
edition = "2021"

[lib]
name = "_accelerate"
crate-type = ["cdylib"]
path = "src/lib.rs"
doctest = false

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
op_ref = "allow"
assign_op_pattern = "allow"
type_complexity = "allow"
too_many_arguments = "allow"

[dependencies]
pyo3 = { version = "=0.27.2", features = ["extension-module", "abi3-py310"] }
numpy = "=0.27.0"
ndarray = "0.16"
num-complex = "0.4"
nalgebra = "0.33"
faer = { version = "0.24", default-features = false, features = ["std"] }
rand = { version = "0.9", features = ["small_rng"] }
rayon = "1.10"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
