[workspace]
members = ["core", "pyext", "qiskit-numerics"]
exclude = ["can_sandwich", "qiskit-pyo3-ffi"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
nalgebra = { version = "0.35", default-features = false, features = ["std"] }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["abi3-py310"] }
rayon = "1.10"

gulps-core = { path = "core" }
can_sandwich = { path = "can_sandwich" }
qiskit-pyo3-ffi = { path = "qiskit-pyo3-ffi" }
qiskit-numerics = { path = "qiskit-numerics" }
ndarray = "0.16"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
redundant_pub_crate = "warn"
items_after_statements = "warn"
fn_params_excessive_bools = "warn"
float_cmp = "warn"
suspicious_operation_groupings = "deny"
unreadable_literal = "warn"
doc_markdown = "warn"
too_many_lines = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
