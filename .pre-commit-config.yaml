exclude: "^dev/"
fail_fast: true
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      # Subject line only: fail if any non-comment line follows it.
      - id: no-commit-body
        name: commit message is one line
        language: pygrep
        entry: '\A[^\n]*\n(?:[ \t]*\n|#[^\n]*\n)*[^#\s]'
        args: [--multiline]
        stages: [commit-msg]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^crates/qiskit-numerics/  # upstream bytes; patch context
      - id: end-of-file-fixer
        exclude: ^crates/qiskit-numerics/
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: [--maxkb=2000]
      - id: name-tests-test
        args: [--pytest-test-first]
        exclude: ^tests/(fixtures/|_common\.py$)
