name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:

# Read access is enough for documentation builds, including pull requests.
permissions:
  contents: read

# One concurrent deploy; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      - uses: dtolnay/rust-toolchain@1.97

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # `pip install -e .` compiles the Rust extension. The [docs] extra adds
      # Sphinx, the Qiskit theme, and packages imported by API documentation.
      - name: Install
        run: pip install -e '.[docs]'

      # Execute every user-guide example and fail on Sphinx warnings.
      - name: Test and build docs
        run: |
          sphinx-build -d docs/_build/doctrees -b html -W --keep-going docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
