name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

jobs:
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pre-commit --quiet

      - run: pre-commit run --all-files

  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      - run: rustup toolchain install  # version from rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      # monodromy is archived and works with lrsgmp 7.1. lrslib 7.3 changes the
      # banner it parses, and the hybrid `lrs` restarts on piped input. lrslib
      # 7.1 is pre-C23 code, so build it as C17.
      - name: Build lrsgmp 7.1 for the monodromy oracle tests
        run: |
          sudo apt-get install -y libgmp-dev
          cd "$RUNNER_TEMP"
          curl -sfL https://cgm.cs.mcgill.ca/~avis/C/lrslib/archive/lrslib-071b.tar.gz -o lrslib.tar.gz
          echo "df22682cd742315fe04f866cfe4804d5950f7dc7f514d5b5f36f5b7f5aff9188  lrslib.tar.gz" | sha256sum -c
          tar xzf lrslib.tar.gz
          make -C lrslib-071b lrsgmp CFLAGS="-O3 -std=gnu17"
          echo "LRS_PATH=$RUNNER_TEMP/lrslib-071b/lrsgmp" >> "$GITHUB_ENV"

      - name: Install
        run: |
          pip install -e '.[test]' --quiet
          pip install "monodromy @ git+https://github.com/qiskit-community/monodromy" --quiet

      - name: Check Rust
        run: |
          cargo fmt --manifest-path crates/Cargo.toml -p gulps-core -p gulps-pyext --check
          cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path crates/Cargo.toml --locked --workspace --all-targets
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path crates/Cargo.toml --no-deps --workspace --exclude qiskit-numerics

      - run: pytest tests/
