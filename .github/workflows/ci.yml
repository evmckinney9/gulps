name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

jobs:
  lint:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pre-commit --quiet

      - run: pre-commit run --all-files

  test:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      - uses: dtolnay/rust-toolchain@1.97
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install lrslib for the monodromy oracle tests
        run: sudo apt-get install -y lrslib

      - name: Install
        run: |
          pip install -e '.[test]' --quiet
          pip install "monodromy @ git+https://github.com/qiskit-community/monodromy" --quiet

      - name: Check Rust
        run: |
          cargo fmt --manifest-path crates/Cargo.toml -p gulps-core -p gulps-pyext --check
          cargo clippy --manifest-path crates/Cargo.toml --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path crates/Cargo.toml --locked --workspace --all-targets
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path crates/Cargo.toml --no-deps --workspace --exclude qiskit-numerics

      - run: pytest tests/
