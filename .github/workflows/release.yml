name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check_version:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check version consistency
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG must be a stable version matching pyproject.toml version $PKG"
            exit 1
          fi
          echo "Version $PKG matches tag v$TAG"

  build_wheels:
    needs: check_version
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-14
    env:
      CIBW_BUILD: "cp310-*"
      CIBW_SKIP: "pp* *-win32 *-musllinux* *_i686"
      CIBW_BEFORE_ALL_LINUX: "curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain none"
      CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
      CIBW_TEST_EXTRAS: test
      CIBW_TEST_COMMAND: >-
        python -m pytest {project}/tests/test_decomposer.py
        {project}/tests/test_invariants.py {project}/tests/test_transpiler.py
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: rustup toolchain install  # version from rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    needs: check_version
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist
        run: pipx run build --sdist
      - name: Install and test sdist
        run: |
          for sdist in dist/*.tar.gz; do
            python -m pip install "${sdist}[test]"
          done
          python -m pytest tests/test_decomposer.py tests/test_invariants.py tests/test_transpiler.py
      - uses: actions/upload-artifact@v7
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  release:
    name: GitHub Release (draft)
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
      - name: Generate changelog
        run: |
          npm install -g conventional-changelog-cli
          conventional-changelog -p conventionalcommits -r 2 | tail -n +3 > CHANGELOG.tmp
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          body_path: CHANGELOG.tmp
